name: Validate module
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get pinned upstream Fail2ban
        uses: actions/checkout@v4
        with:
          repository: fail2ban/fail2ban
          ref: f60978618a101427b06924fc932b44350fec2b63
          path: .build/fail2ban
      - name: Registry, parsers, HTTP API and real Fail2ban integration
        env:
          PYTHONPATH: imageroot/pypkg
          FAIL2BAN_SOURCE: ${{ github.workspace }}/.build/fail2ban
          REQUIRE_ENGINE_TEST: '1'
        run: python3 -m unittest discover -s tests -v
      - name: Real nftables enforcement in isolated network namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2 iputils-ping
          sudo env PYTHONPATH="$PWD/imageroot/pypkg" bash tests/test-firewall.sh
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: yarn install --immutable
        working-directory: ui
      - run: yarn exec eslint --ext .js,.vue src
        working-directory: ui
      - run: yarn build
        working-directory: ui
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - name: Check the PNG logo required by NS8 module discovery
        run: test -n "$(find ui/dist/img -name '*logo*.png' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: module-ui
          path: ui/dist
  images:
    needs: [tests, ui]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: module-ui
          path: ui/dist
      - name: Build the actual NS8 and Fail2ban images
        id: build
        run: ./build-images.sh
        env:
          REPOBASE: 10.0.2.2:5000/ns8-ci
      - name: Export the tested image pair
        run: |
          mkdir -p .build/images
          buildah push "$ENGINE" "oci-archive:$PWD/.build/images/engine.oci"
          buildah push "$MODULE" "oci-archive:$PWD/.build/images/module.oci"
          printf '%s\n' "$ENGINE" > .build/images/engine-reference
        env:
          ENGINE: ${{ steps.build.outputs.engine }}
          MODULE: ${{ steps.build.outputs.module }}
      - uses: actions/upload-artifact@v4
        with:
          name: ns8-images
          path: .build/images
          retention-days: 7
  ns8:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ns8-images
          path: .build/images
      - name: Install VM test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils skopeo acl
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install NS8 and exercise the module
        run: bash scripts/qemu-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ns8-smoke-diagnostics
          path: tests/outputs
          retention-days: 7
  publish-development-image:
    needs: ns8
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: module-ui
          path: ui/dist
      - name: Build validated source with public registry references
        id: images
        run: ./build-images.sh
        env:
          REPOBASE: ghcr.io/${{ github.repository_owner }}
      - name: Log in to GHCR
        run: printf '%s' "$REGISTRY_TOKEN" | buildah login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish development module and matching engine
        run: |
          buildah push "$ENGINE" "docker://$ENGINE"
          buildah push "$MODULE" "docker://$MODULE:dev"
          buildah push "$MODULE" "docker://$MODULE:sha-${GITHUB_SHA:0:12}"
        env:
          ENGINE: ${{ steps.images.outputs.engine }}
          MODULE: ${{ steps.images.outputs.module }}
