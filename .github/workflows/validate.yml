name: Validate module
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check catalog version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            .github/scripts/check-catalog-version --base "origin/$BASE_REF"
          elif [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            .github/scripts/check-catalog-version --base "origin/$DEFAULT_BRANCH"
          else
            .github/scripts/check-catalog-version
          fi
      - name: Get pinned upstream Fail2ban
        uses: actions/checkout@v7
        with:
          repository: fail2ban/fail2ban
          ref: f60978618a101427b06924fc932b44350fec2b63
          path: .build/fail2ban
      - name: Registry, parsers, HTTP API and real Fail2ban integration
        env:
          PYTHONPATH: imageroot/pypkg
          FAIL2BAN_SOURCE: ${{ github.workspace }}/.build/fail2ban
          REQUIRE_ENGINE_TEST: '1'
        run: python3 -m unittest discover -s tests -v
      - name: Real nftables enforcement in isolated network namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2 iputils-ping
          sudo env PYTHONPATH="$PWD/imageroot/pypkg" bash tests/test-firewall.sh
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      - run: yarn install --immutable
        working-directory: ui
      - run: yarn exec eslint --ext .js,.vue src
        working-directory: ui
      - run: yarn build
        working-directory: ui
      - name: Check the PNG logo required by NS8 module discovery
        run: test -n "$(find ui/dist/img -name '*logo*.png' -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: module-ui
          path: ui/dist
  images:
    needs: [tests, ui]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      module: ${{ steps.publish.outputs.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: module-ui
          path: ui/dist
      - name: Build the actual NS8 and Fail2ban images
        id: build
        run: ./build-images.sh
        env:
          REPOBASE: ghcr.io/${{ github.repository_owner }}
      # The QEMU node pulls the module and, through org.nethserver.images, the
      # engine from GHCR. Pull requests only build; their branch push tests.
      - name: Publish the images under test
        id: publish
        if: github.event_name != 'pull_request'
        run: |
          printf '%s' "$REGISTRY_TOKEN" | buildah login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          tag="sha-$(git rev-parse --short=12 HEAD)"
          buildah push "$ENGINE" "docker://$ENGINE"
          buildah push "$MODULE" "docker://$MODULE:$tag"
          printf 'module=%s:%s\n' "$MODULE" "$tag" >> "$GITHUB_OUTPUT"
        env:
          ENGINE: ${{ steps.build.outputs.engine }}
          MODULE: ${{ steps.build.outputs.module }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ns8:
    # Static: a job skipped by its `if` (pull requests) shows its name with the
    # matrix expressions unexpanded. The called job adds "<scenario> <distro>".
    name: NS8
    needs: images
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky9, debian13]
        scenario: [install, update]
    # statuses: write lets each leg report continuous-integration/qemu/<distro>-<scenario>.
    permissions:
      contents: read
      statuses: write
    uses: NethServer/ns8-github-actions/.github/workflows/test-on-qemu.yml@v1
    with:
      distro: ${{ matrix.distro }}
      image_url: ${{ needs.images.outputs.module }}
      repo_ref: ${{ github.sha }}
      version_tag: ${{ github.ref_name }}
      artifact_suffix: ${{ matrix.scenario }}
      status_suffix: ${{ matrix.scenario }}
      script: test-module-${{ matrix.scenario }}.sh
      timeout_minutes: 60
  publish-development-image:
    needs: [images, ns8]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Publish the tested module as dev
        run: |
          if [[ "$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists; skip this development image.'
            exit 0
          fi
          printf '%s' "$REGISTRY_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          # The exact image the NS8 legs tested; its engine is already published.
          skopeo copy --all "docker://$MODULE" "docker://${MODULE%:*}:dev"
          echo "Published ${MODULE%:*}:dev from $MODULE" >> "$GITHUB_STEP_SUMMARY"
        env:
          MODULE: ${{ needs.images.outputs.module }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
